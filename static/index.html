<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NotionLy</title>
    <meta name="description" content="Platform berbagi catatan dan file real-time.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css?v=3">
</head>
<body>

    <!-- Modal Landing -->
    <div id="roomModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <svg class="icon-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
                <h1>NotionLy</h1>
                <p>Kolaborasi catatan real-time & berbagi file.</p>
            </div>
            
            <form id="joinRoomForm" onsubmit="handleJoinRoom(event)">
                <div class="input-group">
                    <label for="roomInput">ID Ruangan</label>
                    <div class="input-row">
                        <input type="text" id="roomInput" placeholder="Masukkan ID ruangan" required autocomplete="off">
                        <button type="button" class="btn-outline" onclick="generateRandomRoom()" title="Acak ID">
                            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>
                        </button>
                    </div>
                </div>
                
                <button type="submit" class="btn-primary w-full">Gabung Ruangan</button>
            </form>
        </div>
    </div>

    <!-- Main Workspace -->
    <div id="appContainer" class="app-container hidden">
        <!-- Top Navigation -->
        <header class="app-navbar">
            <div class="nav-brand" onclick="leaveRoom()" title="Keluar">
                <svg class="icon-logo-small" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path></svg>
                <span class="brand-text">NotionLy</span>
            </div>
            
            <div class="nav-center">
                <div class="room-info">
                    <span class="room-label">ID:</span>
                    <span id="currentRoomDisplay" class="room-id"></span>
                </div>
                <div class="status-indicator">
                    <div class="status-dot" id="statusDot"></div>
                    <span id="statusText">Menghubungkan</span>
                </div>
            </div>

            <div class="nav-actions">
                <div class="users-count" title="Pengguna aktif">
                    <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                    <span id="userCount">1</span>
                </div>
                <button class="btn-icon" onclick="copyRoomLink()" title="Salin Tautan">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                </button>
                <button class="btn-icon" onclick="leaveRoom()" title="Keluar">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                </button>
            </div>
        </header>

        <!-- Main Content Grid -->
        <main class="workspace-grid">
            <!-- Notes Section -->
            <section class="view-panel" id="notePanel">
                <div class="panel-head">
                    <div class="panel-title">
                        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                        <h2>Catatan</h2>
                        <span id="syncIndicator" class="badge-sync">Sinkron</span>
                    </div>
                    <div class="panel-tools">
                        <button class="btn-tool" onclick="copyNoteContent()" title="Salin">
                            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                        </button>
                        <button class="btn-tool" onclick="downloadNoteTxt()" title="Unduh">
                            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                        </button>
                        <button class="btn-tool text-danger" onclick="clearNoteContent()" title="Bersihkan">
                            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                        </button>
                    </div>
                </div>
                <div class="editor-container">
                    <textarea id="noteArea" placeholder="Mulai mengetik..." spellcheck="false"></textarea>
                </div>
                <div class="panel-foot">
                    <span id="charCount">0 ch</span>
                    <span id="wordCount">0 wd</span>
                    <span id="lineCount">1 ln</span>
                </div>
            </section>

            <!-- Files Section -->
            <section class="view-panel" id="filePanel">
                <div class="panel-head">
                    <div class="panel-title">
                        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                        <h2>Berkas</h2>
                        <span class="badge-limit">5GB</span>
                    </div>
                </div>

                <div class="upload-area" id="dropzone" onclick="triggerFileInput()">
                    <input type="file" id="fileInput" onchange="handleFileSelect(event)" class="hidden">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="1.5" fill="none"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                    <p class="upload-text">Ketuk untuk unggah, atau tarik berkas.</p>
                </div>

                <div id="uploadProgressContainer" class="upload-progress hidden">
                    <div class="progress-header">
                        <span id="uploadingFileName" class="text-truncate">Memuat...</span>
                        <span id="uploadPercentage">0%</span>
                    </div>
                    <div class="progress-track">
                        <div id="progressBar" class="progress-fill"></div>
                    </div>
                    <div class="progress-footer">
                        <span id="uploadSpeed">--/s</span>
                        <button class="btn-text text-danger" onclick="cancelUpload()">Batal</button>
                    </div>
                </div>

                <div class="file-list-controls">
                    <div class="search-box">
                        <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        <input type="text" id="fileSearchInput" placeholder="Cari..." oninput="filterFiles()">
                    </div>
                </div>

                <div class="files-container" id="fileList">
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" width="32" height="32" stroke="currentColor" stroke-width="1" fill="none"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                        <p>Belum ada berkas.</p>
                    </div>
                </div>
            </section>
        </main>

        <!-- Mobile Bottom Tabs -->
        <nav class="bottom-nav">
            <button class="nav-item active" id="tabNoteBtn" onclick="switchTab('note')">
                <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
                <span>Catatan</span>
            </button>
            <button class="nav-item" id="tabFileBtn" onclick="switchTab('file')">
                <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                <span>Berkas</span>
            </button>
        </nav>
    </div>

    <!-- Toasts -->
    <div id="toastContainer" class="toast-wrapper"></div>

    <script src="/js/app.js?v=4"></script>
</body>
</html>
