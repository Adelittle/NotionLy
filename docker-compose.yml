version: '3.8'

services:
  notionly:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: notionly-app
    ports:
      - "80:8080"
    volumes:
      - notionly_uploads:/app/uploads
    environment:
      - PORT=8080
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: false

volumes:
  notionly_uploads:
    driver: local
